    <!-- Main -->
    <div class="form-container">
        <h1>Hope Grant - Final Report</h1>
        <p>Please answer the following questions.<br>
            Due<strong> May 1st, 2027</strong></p>
        <form action="" method="POST"></form>
        <section id="contact-information">
            <!-- Contact info section -->
            <fieldset>
                <h3>Contact Information</h3>
                <div>
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first_name" required>
                </div>
                <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last_name" required>
                </div>
                <div>
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="school-district">School District</label>
                    <input type="text" id="school-district" name="school_district" required>
                </div>
                <div>
                    <label for="project-name">Project Name</label>
                    <input type="text" id="project-name" name="project_name" required>
                </div>
            </fieldset>
        </section>
        <!-- Report questions section  -->
        <section id="report-questions">
            <fieldset>
                <h3>Report Questions</h3>
                <div>
                    <!-- question 1 -->
                    <p><label for="project-overview">1. Tell us about your 2026-2027 Hope Grant project. Did your project
                            work out the way you envisioned? Did you accomplish the goals you wished to accomplish? What
                            changes occurred because of this project? Did you address the needs you hoped to impact, and if
                            so, tell us about that impact.</label></p>
                    <textarea id="project-overview" name="project_overview" rows="8" required></textarea>
                </div>
                <div>
                    <!-- question 2 -->
                    <p><label for="children-impacted">2. How many children were impacted by this project? How were these
                            children impacted?</label></p>
                    <textarea id="children-impacted" name="children_impacted" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 3 -->
                    <p><label for="other-individuals-impacted">3. How many other individuals do you estimate were also
                            impacted by this project?</label></p>
                    <textarea id="other-individuals-impacted" name="other_individuals_impacted" rows="4"
                        required></textarea>
                </div>
                <div>
                    <!-- question 4 -->
                    <p><label for="long-term-impact">4. What long-term impact will this project have on your students, their
                            families, and your community?</label></p>
                    <textarea id="long-term-impact" name="long_term_impact" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 5 -->
                    <p><label for="hope-impact">5. How did you feel this project increased hope in students? What is your
                            definition of "hope" as it relates to this project?</label></p>
                    <textarea id="hope-impact" name="hope_impact" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 6 -->
                    <p><label for="remaining-funds">6. Do you have remaining funds from the Hope Grant? If so, how
                            much?</label></p>
                    <textarea id="remaining-funds" name="remaining_funds" rows="4" required></textarea>
                </div>
                <div>
                    <!-- question 7 -->
                    <p><label for="budget">7. Budget: How were Hope Grant funds spent and how much did you spend? Please
                            provide a general budget of how dollars were spent.</label></p>
                    <textarea id="budget" name="budget" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 8 -->
                    <p><label for="what-worked-well">8. What aspects of the project worked well, or better than
                            expected?</label></p>
                    <textarea id="what-worked-well" name="what_worked_well" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 9 -->
                    <p><label for="challenges">9. Did you face any challenges and how were they addressed or
                            resolved?</label></p>
                    <textarea id="challenges" name="challenges" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 10 -->
                    <p><label for="story-1">10. Story 1 - Please provide a written story about the impact of your grant.
                            <em>(Note: these stories will be shared publicly)</em></label></p>
                    <textarea id="story-1" name="story_1" rows="8" required></textarea>
                </div>
                <div>
                    <!-- q10 cont'd -->
                    <p><label for="story-2">Story 2</label></p>
                    <textarea id="story-2" name="story_2" rows="8" required></textarea>
                </div>
                <div>
                    <!-- question 11 -->
                    <p><label for="future-funding">11. If Silver Dollar City Foundation provides Hope Grant opportunities
                            next year, do you anticipate requesting funding to continue or expand on this project, and
                            why?</label></p>
                    <textarea id="future-funding" name="future_funding" rows="6" required></textarea>
                </div>
                <div>
                    <!-- question 12 - video upload link -->
                    <p><label for="video-link">12. Video Upload Link - Please submit a video approximately 90 seconds in
                            length that Silver Dollar City Foundation may share about how your district was impacted by your
                            Hope Grant. Your video may include comments from administrators, counselors, teachers, or other
                            staff. <em>Please do not share personally identifiable information unless the family has consented.</em>
                            These videos may be shared publicly.</label></p>
                    <input type="url" id="video-link" name="video_link" placeholder="https://" required>
                </div>
            </fieldset>
        </section>
        <!-- Final report submit button  -->
        <button type="submit" id="btn-final-report">Submit Final Report</button>
