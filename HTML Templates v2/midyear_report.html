
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mid Year Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/forms.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
    crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>

<body>

    <div id = "navbar"></div>
      
    <!-- Main section -->
    <div class="form-container">
        <h1 style = "text-align:center;">Hope Grant Mid-Year Report</h1>
        <p>Please answer the following questions. <br>
            Due <strong>December 18th, 2026</strong>
        </p>
        <form action="" method="POST">
            <!-- Ideally I think we should have the mid year reports connected to the school's information automatically
         it would really help with linking and keeping the data clean-->
            <section id="contact-info">
                <fieldset>
                    <!-- Contact info -->
                    <h3>Contact Information</h3>
                    <div>
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first_name" required>
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last_name" required>
                    </div>
                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="school-district">School District</label>
                        <input type="text" id="school-district" name="school_district" required>
                    </div>
                    <div>
                        <label for="hope-grant-project">Hope Grant Project</label>
                        <input type="text" id="hope-grant-project" name="hope_grant_project" required>
                    </div>
                </fieldset>
                <!-- Report questions section -->
            </section>
            <section id="report-questions">
                <fieldset>
                    <h3>Report Questions</h3>
                    <div>
                        <p><label for="progress-update">1. Please provide a quick update about the progress of your
                                2026-2027 Hope Grant.</label></p>
                        <textarea id="progress-update" name="progress_update" rows="6" required></textarea>
                    </div>
                    <div>
                        <p><label for="unexpected-difficulties">2. Have you encountered any unexpected difficulties? If so,
                                please explain and share how you did or plan to overcome those challenges.</label></p>
                        <textarea id="unexpected-difficulties" name="unexpected_difficulties" rows="6" required></textarea>
                    </div>
                    <div>
                        <p><label for="successes">3. Do you have any successes or stories you can share?</label></p>
                        <textarea id="successes" name="successes" rows="6" required></textarea>
                    </div>
                    <div>
                        <p><label for="additional-comments">4. Any additional information or comments you'd like to
                                share?</label></p>
                        <textarea id="additional-comments" name="additional_comments" rows="6"></textarea>
                    </div>
                </fieldset>
            </section>
            <!-- Submit mid year report button -->
            <button type="submit" id="btn-midyear-submit">Submit Mid-Year Report</button>
        </form>
    </div>
    <script>
        $(function(){
            $('#navbar').load('static/resources/navbar.html');
        });
    </script>
</body>

</html>
