{% extends "base.html" %}
{% load static %}

{% block title %}Hope Grant Application{% endblock %}
{% comment %} doing this so that the link is in a head tag {% endcomment %}
{% block extra_styles %}
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
{% endblock %}

{% block content %}
<div class = "form-container">
<h2>Reset Password</h2>

<form method="post" action="{% url 'accounts:password_reset' %}">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Send reset email</button>
</form>
</div>

{% endblock %}
